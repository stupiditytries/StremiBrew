[package]
name = "stremio-core-ps5"
version = "0.1.0"
edition = "2021"
publish = false
description = "C interface to stremio-core for the PS5 app"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# `env-future-send` makes the core's futures `Send`, so they can run on thread pools.
stremio-core = { path = "../..", features = ["derive", "env-future-send"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = { version = "0.3", features = ["thread-pool"] }
http = "1.2"
url = "2.4"
chrono = "0.4"
once_cell = "1"
# Blocking HTTPS client with a pure-Rust TLS stack and bundled root certificates.
ureq = { version = "2", default-features = false, features = ["tls"] }

# Not a member of the core's workspace: it is built for the PS5 target on its own.
[workspace]

[profile.release]
panic = "abort"
opt-level = 2
