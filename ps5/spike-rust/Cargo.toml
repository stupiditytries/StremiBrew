[package]
name = "spike-rust"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# HTTPS client with a pure-Rust TLS stack (rustls + ring) and bundled root certificates.
ureq = { version = "2", default-features = false, features = ["tls"] }

[workspace]

[profile.release]
panic = "abort"
opt-level = 2
